[platformio]
default_envs = meter

[env:meter]
platform = https://github.com/pioarduino/platform-espressif32.git
board = BOARD_VIEWE_UEDX32480035E_WB_A
framework = arduino
monitor_speed = 115200
custom_ota_board = meter-viewe

extra_scripts =
    pre:tools/build_web_assets_platformio.py
    pre:generate_build_time.py
    pre:tools/generate_ota_config.py
    post:tools/platformio_ota.py

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.filesystem = littlefs

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -I include/esp
    -D LV_CONF_INCLUDE_SIMPLE
    -D BOARD_HAS_PSRAM
    -D POWER_METER_HAS_PSRAM=1
    -D POWER_METER_HAS_TOUCH_UI=1
    -D POWER_METER_HAS_STATUS_DISPLAY=0
    -D POWER_METER_HARDWARE_PROFILE=\"meter-viewe\"
    -D POWER_METER_LOCAL_SENSOR_BACKEND=\"esp32-adc\"
    -D POWER_METER_SUPPORTS_ADC=1
    -D POWER_METER_SUPPORTS_UART=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_DFU_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    lvgl/lvgl@8.4.0
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git
    esp-arduino-libs/esp-lib-utils@>=0.2.0,<0.3.0
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git

[env:wroom32]
platform = https://github.com/pioarduino/platform-espressif32.git
board = lolin32
framework = arduino
monitor_speed = 115200
upload_speed = 115200
custom_ota_board = meter-wroom

extra_scripts =
    pre:tools/build_web_assets_platformio.py
    pre:generate_build_time.py
    pre:tools/generate_ota_config.py
    post:tools/platformio_ota.py

board_build.f_cpu = 240000000L
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_wroom.csv
board_build.filesystem = littlefs

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -D POWER_METER_HAS_PSRAM=0
    -D POWER_METER_HAS_TOUCH_UI=0
    -D POWER_METER_HAS_STATUS_DISPLAY=0
    -D POWER_METER_HARDWARE_PROFILE=\"meter-wroom\"
    -D POWER_METER_LOCAL_SENSOR_BACKEND=\"none\"
    -D POWER_METER_SUPPORTS_ADC=0
    -D POWER_METER_SUPPORTS_UART=0
    -D POWER_METER_SENSOR_HISTORY_SIZE=60
    -D POWER_METER_USE_SIMULATED_SENSORS=1
    -D CORE_DEBUG_LEVEL=0

build_src_filter =
    +<*>
    -<board_setup.cpp>
    -<lvgl_v8_port.cpp>
    -<ui/>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<sensors/pm1_uart_protocol.cpp>
    +<network/history_response_encoder.cpp>
build_flags =
    -std=gnu++17
    -I src
