[platformio]
default_envs = meter

[env:meter]
platform = https://github.com/pioarduino/platform-espressif32.git
board = BOARD_VIEWE_UEDX32480035E_WB_A
framework = arduino
monitor_speed = 115200

extra_scripts =
    pre:tools/build_web_assets_platformio.py
    pre:generate_build_time.py
    pre:tools/generate_ota_config.py
    post:tools/platformio_ota.py

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.filesystem = littlefs

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -I include/esp
    -D LV_CONF_INCLUDE_SIMPLE
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_DFU_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    lvgl/lvgl@8.4.0
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git
    esp-arduino-libs/esp-lib-utils@>=0.2.0,<0.3.0
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
